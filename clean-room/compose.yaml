# Local infrastructure only. The host planes and external Bifrost are not started here.
# SDK 0.12.1 does not identify a compatible server image: choose/test RESTATE_IMAGE explicitly.
services:
  restate:
    image: ${RESTATE_IMAGE:?Set RESTATE_IMAGE to a reviewed release or immutable digest}
    command: ["--node-name=sfactory-restate"]
    ports:
      - "127.0.0.1:8090:8080" # HTTP ingress; avoid external Bifrost's common 8080
      - "127.0.0.1:9070:9070" # Admin API; not gRPC
    volumes:
      - restate-data:/restate-data

  postgres:
    # Planning explicitly selects the pg16 image so migration 0002 can enable vector.
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_USER: sfactory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD locally}
      POSTGRES_DB: sfactory
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfactory -d sfactory"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  restate-data:
  pgdata:
