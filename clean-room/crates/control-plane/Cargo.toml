[package]
name = "control-plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
shared.workspace = true
evaluator = { path = "../evaluator" }
tokio.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = "=0.10.9"
libc = "=0.2.190"
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ulid.workspace = true
chrono.workspace = true
restate-sdk = { workspace = true, optional = true }
axum.workspace = true
sqlx.workspace = true
dotenvy.workspace = true
reqwest.workspace = true
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
tree-sitter = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }

[features]
default = []
# Opt-in: the durable orchestration layer (workflow.rs). Gated because the exact Restate 0.12
# SDK surface must be verified against a live build before it compiles.
restate = ["dep:restate-sdk"]
# Compile-time fixed root-grant canary paths; never caller-controlled.
grant-sidecar = ["restate"]
real-sidecar = ["grant-sidecar"]
registry-sidecar = ["real-sidecar"]
# Separate immutable SDK endpoint and socket namespace for the next handler version.
registry-v5 = ["registry-sidecar"]
# Deterministic publisher crash barrier; excluded from production build features.
root-authorization-canary = ["restate"]
# Opt-in: the AST knowledge graph (memory.rs `parse_rust`). Gated so the core builds without the
# tree-sitter grammars.
ast = ["dep:tree-sitter", "dep:tree-sitter-rust"]

[dev-dependencies]
http-body-util = "0.1"
