[package]
name = "watchdog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
fixture = []
registry-grant = ["dep:control-plane"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
libc = "=0.2.190"
sha2 = "=0.10.9"
serde.workspace = true
serde_json.workspace = true
subtle = "=2.6.1"
tokio.workspace = true
ulid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
control-plane = { path = "../control-plane", optional = true, features = ["registry-sidecar"] }

[dev-dependencies]
reqwest.workspace = true
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "sf-watchdog-fixture"
path = "src/main.rs"
required-features = ["fixture"]

[[example]]
name = "broker_capture_fixture"
required-features = ["fixture"]

[[example]]
name = "trusted_release_fixture"
required-features = ["fixture"]
