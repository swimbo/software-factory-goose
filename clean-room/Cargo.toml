[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/control-plane",
    "crates/execution",
    "crates/evaluator",
    "crates/sfctl",
    "crates/watchdog",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"

[workspace.dependencies]
shared = { path = "crates/shared" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }

restate-sdk = "0.12"
axum = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "chrono", "json"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json"] }
regex = "1"
toml = "0.8"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"

[profile.release]
lto = true
